<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DMC data loader</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
    <style>
      #app-loader {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #fff;
        z-index: 9999;
      }
      #app-loader.fade-out {
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.3s ease;
      }
      .loader {
        width: 72px;
        height: 72px;
        border: 8px solid rgba(112, 110, 245, 0.15);
        border-left-color: #706ef5;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="app-loader"><div class="loader"></div></div>
    <dmc-root></dmc-root>
    <script>
      window.addEventListener('app-ready', () => {
        const loader = document.getElementById('app-loader');
        if (!loader) return;
        loader.classList.add('fade-out');
        setTimeout(() => loader.remove(), 300);
      });
    </script>
  </body>
</html>
